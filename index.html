<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF5E9">
<!-- 🚨 Запрет поисковикам. До подачи уведомления в Роскомнадзор, политики
     обработки и согласия отдельным документом игра не должна находиться
     поиском: открытый адрес = доступ чужих детей, даже если ссылку никто
     не давал. На GitHub Pages нельзя задать заголовок X-Robots-Tag —
     поэтому запрет ставится тегом в странице плюс robots.txt. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Знайчик</title>
<!-- 🚨 Значок на домашнем экране. Андрей тестирует с планшета и вбивал адрес
     руками; значок убирает ввод адреса совсем. Ребёнку это тоже нужно:
     в полноэкранном режиме нет адресной строки, за которую он цепляется
     пальцем и выходит из игры посреди задания.
     Теги Apple ОТДЕЛЬНО от манифеста: старые айпады манифест не читают,
     а игра целится именно в них. -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Знайчик">
<link rel="apple-touch-icon" href="./ikonki/znachok-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="./ikonki/znachok-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="./ikonki/znachok-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="./ikonki/znachok-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./ikonki/znachok-192.png">
<!-- 🚨 Шрифты СВОИ, а не с fonts.googleapis.com. Детское приложение
     не должно при каждом открытии отдавать за границу адрес планшета
     ребёнка, и игра обязана работать без сети (правило проекта).
     Собирается инструментом tools/zabrat_shrifty.py — 8 файлов, 189 КБ. -->
<link rel="stylesheet" href="./shrifty.css">
<style>
:root{
  --list:#FBF5E9; --list-2:#F2E8D5; --kora:#E0D0B2;
  --chernila:#2C2820; --tihiy:#6E6455;
  --yantar:#E68A2E; --moh:#5D8F52; --nebo:#6FA3BD; --yagoda:#C25548;
  --oreh:#B07A46; --oreh-shapka:#7C5230;
  --ten:0 5px 0 rgba(44,40,32,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --list:#18211C; --list-2:#212D25; --kora:#2F4036;
    --chernila:#F2EADA; --tihiy:#A5B5A2;
    --yantar:#F0A55C; --moh:#7DB271; --nebo:#87B5CC; --yagoda:#D26F61;
    --oreh:#C79361; --oreh-shapka:#96683F;
    --ten:0 5px 0 rgba(0,0,0,.30);
  }
}
:root[data-theme="dark"]{
  --list:#18211C; --list-2:#212D25; --kora:#2F4036;
  --chernila:#F2EADA; --tihiy:#A5B5A2;
  --yantar:#F0A55C; --moh:#7DB271; --nebo:#87B5CC; --yagoda:#D26F61;
  --oreh:#C79361; --oreh-shapka:#96683F;
  --ten:0 5px 0 rgba(0,0,0,.30);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:var(--list); color:var(--chernila);
  font-family:Nunito,system-ui,sans-serif; font-weight:700;
  overflow:hidden; user-select:none; touch-action:manipulation;
}
.ekran{height:100%;display:none;flex-direction:column;padding:clamp(12px,2.2vh,22px);
  max-width:1200px;margin:0 auto;gap:clamp(10px,2vh,20px)}
/* Полоска прогресса держится вверху, а «зверь + задание» стоят одной
   группой по центру остатка. Без этого стол растягивался на всю высоту
   и центрировал карточки внутри себя — между зверем и заданием зияла
   треть экрана (поймано глазами на скриншоте 29.08). */
#igra .verh{flex:0 0 auto}
#igra .geroy{margin-top:auto}
#igra .stol{flex:0 0 auto;margin-bottom:auto}
.ekran.vidno{display:flex}

/* ── вход: выбор зверька. Первое касание разблокирует звук ─────── */
#vhod{align-items:center;justify-content:center;text-align:center}
#vhod h1{font-family:Comfortaa,sans-serif;font-size:clamp(24px,5vw,42px);margin:0}
#vhod .pod{color:var(--tihiy);font-size:clamp(14px,2vw,18px);font-weight:600;margin:0}
.zveri-vybor{display:flex;gap:clamp(12px,2.5vw,26px);flex-wrap:wrap;justify-content:center;margin-top:clamp(14px,3vh,30px)}
.zver-karta{
  width:clamp(100px,min(26vw,20vh),190px);background:var(--list-2);border:none;border-radius:26px;
  padding:clamp(10px,1.6vw,18px);cursor:pointer;box-shadow:var(--ten);transition:transform .15s;
}
.zver-karta:active{transform:translateY(3px);box-shadow:none}
.zver-karta:focus-visible{outline:4px solid var(--nebo);outline-offset:4px}
/* 🚨 Без aspect-ratio: он появился в Safari только с версии 15, а на старом
   планшете карточка без высоты схлопывалась в ничто. Держим квадрат через
   padding-приём, который понимают все браузеры. */
.zver-karta svg,.zver-karta img,.zver-karta picture{width:100%;height:auto;display:block}
.zver-karta picture{position:relative;padding-top:100%}
/* 🚨 Без inset и object-fit: оба появились в Safari недавно (14.1 и 10),
   а на старом планшете картинка из-за них не появлялась вовсе.
   Растягиваем по четырём сторонам — так умеет любой браузер. */
.zver-karta picture img{position:absolute;top:0;left:0;width:100%;height:100%}

/* ── игра ──────────────────────────────────────────────────────── */
.verh{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:34px}
.put{display:flex;align-items:center;flex:1;min-width:0}
.tropa{flex:1;height:clamp(10px,1.6vh,14px);background:var(--kora);border-radius:999px;
  overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.tropa i{display:block;height:100%;background:var(--moh);border-radius:999px;
  transition:width .45s cubic-bezier(.34,1.2,.64,1)}
.korzinka{display:flex;align-items:center;gap:6px;flex:0 0 auto;min-width:74px;
  justify-content:flex-end;background:var(--list-2);border-radius:999px;
  padding:6px 14px 6px 10px;box-shadow:var(--ten)}
.korzinka.pusto{opacity:.45}
.korzinka i{width:clamp(15px,2.1vw,21px);height:clamp(15px,2.1vw,21px);border-radius:50%;flex:0 0 auto;
  background:var(--yagoda);display:block;animation:pribyla .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pribyla{0%{transform:scale(0) translateY(-30px)}100%{transform:scale(1) translateY(0)}}
.korzinka .schet{font-family:Comfortaa;font-weight:700;font-size:15px;color:var(--chernila);margin-left:3px;font-variant-numeric:tabular-nums}
.shag{width:clamp(18px,2.6vw,26px);height:clamp(18px,2.6vw,26px);border-radius:50%;
  background:var(--kora);display:grid;place-items:center;transition:.35s}
.shag svg{width:60%;height:60%;opacity:0;transform:scale(.4);transition:.35s}
.shag.proyden{background:var(--moh)} .shag.proyden svg{opacity:1;transform:scale(1)}
.shag.tekushiy{background:var(--yantar);transform:scale(1.3)}

.geroy{display:flex;align-items:center;justify-content:center;gap:clamp(12px,2.6vw,30px);flex:0 0 auto}
/* Без aspect-ratio (Safari 15): на старом планшете зверь схлопывался
   в полоску. Квадрат держим высотой, равной ширине, — работает везде. */
.geroy .zver{width:clamp(130px,28vh,270px);height:clamp(130px,28vh,270px);flex:0 0 auto}
.geroy .zver svg,.geroy .zver img,.geroy .zver picture{width:100%;height:100%;display:block}
.zver.rad{animation:radost .6s cubic-bezier(.34,1.56,.64,1)}
.zver.dumaet{animation:razdumye 1.4s ease-in-out}
@keyframes razdumye{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes radost{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-16px) rotate(-5deg)}}
.zver.zhdet{animation:dyshit 2.6s ease-in-out infinite}
@keyframes dyshit{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.rech{display:flex;flex-direction:column;gap:clamp(8px,1.5vh,14px);min-width:0}
.slushat{
  align-self:flex-start;display:inline-flex;align-items:center;gap:10px;
  background:var(--yantar);color:#fff;border:none;border-radius:999px;
  padding:clamp(13px,2vh,19px) clamp(20px,3.2vw,32px);cursor:pointer;
  font:inherit;font-family:Comfortaa,sans-serif;font-weight:700;
  font-size:clamp(16px,2.2vw,22px);box-shadow:var(--ten)
}
.slushat:active{transform:translateY(3px);box-shadow:none}
/* Телефон: зверь и кнопка не помещаются в ряд — на 390 px кнопка
   вылезала за край и страница ездила вбок (поймано проверкой 29.08).
   Ставим в колонку, зверя ужимаем. */
@media (max-width:560px){
  /* Одиннадцать шагов пути плюс корзинка не влезали в 360 px —
     страница ездила вбок. Ужимаем и то и другое. */
  .verh{gap:8px}
  .put{gap:4px}
  .shag{width:15px;height:15px}
  .korzinka{min-width:0;padding:5px 10px 5px 7px;gap:4px}
  .korzinka i:not(:last-of-type){display:none}
  .geroy{flex-direction:column;gap:clamp(8px,1.4vh,14px)}
  .geroy .zver{width:clamp(104px,20vh,170px)}
  .rech{align-items:center;text-align:center;max-width:100%}
  .slushat{align-self:center;max-width:100%}
}
.slushat.zovyot,.v.zovyot{animation:zov 1.1s ease-in-out infinite}
@keyframes zov{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.podpis{font-family:Comfortaa,sans-serif;font-weight:600;font-size:clamp(12px,1.4vw,15px);
  color:var(--tihiy);margin:0;max-width:34ch;line-height:1.4}

.stol{flex:1;display:flex;flex-direction:column;justify-content:center;
  gap:clamp(12px,2.2vh,24px);min-height:0}
/* строка текста читается как строка: слова подряд, без больших зазоров */
.stroka-teksta{gap:clamp(4px,0.8vw,10px)!important}
.stroka-teksta .v{min-width:auto!important;padding:clamp(10px,1.6vw,20px) clamp(14px,2.2vw,28px)!important}
.okoshki{display:flex;gap:clamp(7px,1.2vw,13px);justify-content:center}
.okno{width:clamp(64px,11vw,120px);height:clamp(78px,14vh,144px);border-radius:20px;
  border:4px dashed var(--kora);display:grid;place-items:center;
  font-family:Nunito;font-weight:900;font-size:clamp(34px,6vw,62px);transition:.2s}
.okno.zhdet{border-color:var(--yantar);background:color-mix(in srgb,var(--yantar) 10%,transparent)}
.okno.zanyato{border-style:solid;border-color:var(--moh);background:var(--list-2)}

.varianty{display:flex;gap:clamp(8px,1.6vw,18px);justify-content:center;flex-wrap:wrap}
.v{background:var(--list-2);border:none;border-radius:22px;box-shadow:var(--ten);cursor:pointer;
  min-width:clamp(90px,14vw,175px);min-height:clamp(90px,14vw,175px);
  display:grid;place-items:center;padding:clamp(8px,1.4vw,16px);
  font-family:Nunito;font-weight:900;font-size:clamp(34px,5.6vw,60px);color:var(--chernila);
  transition:transform .14s}
.v.slovo{font-size:clamp(22px,3.4vw,38px);min-width:clamp(110px,17vw,200px)}
.v:active{transform:translateY(3px);box-shadow:none}
.v:focus-visible{outline:4px solid var(--nebo);outline-offset:4px}
.v.ushla{opacity:.25;pointer-events:none}
/* Буква не подошла: качнулась и осталась на месте. Это про физику,
   а не про оценку — цвет не меняется. */
.v.ne-podoshla{animation:kachnulas .45s ease}
@keyframes kachnulas{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* 🚨 Картинка в варианте ответа держится в тех же границах, что фигура.
   Раньше правило было только для svg — подключили рисунки, и мяч занял
   весь экран, вытолкнув остальные варианты за край. Поймано на живой
   пробе 31.08. */
.v svg{width:clamp(64px,10vw,128px);height:auto;display:block}
.v picture{display:block;width:clamp(64px,10vw,128px);height:clamp(64px,10vw,128px)}
.v picture img{width:100%;height:100%;display:block}
.v.verno{background:var(--moh);color:#fff}
.v.mimo{animation:net .45s ease}
@keyframes net{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.v .kucha{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;max-width:150px}
/* 🚨 Орешки ОДНОГО цвета и одной формы: в задании «где больше» кучки
   должны различаться только размером. Раньше крупные были голубые,
   мелкие зелёные — ребёнок сравнивал разноцветные кучки, и мы мерили
   не счёт, а реакцию на цвет. Найдено 29.08 при разборе задания. */
.v .kucha i{display:block;position:relative;border-radius:52% 52% 46% 46%;
  background:var(--oreh);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.v .kucha i::before{content:'';position:absolute;left:12%;right:12%;top:-8%;height:34%;
  background:var(--oreh-shapka);border-radius:50% 50% 30% 30%}
.v .kucha i.m{width:clamp(15px,2.2vw,22px);height:clamp(17px,2.5vw,25px)}
.v .kucha i.b{width:clamp(26px,3.8vw,38px);height:clamp(29px,4.2vw,43px)}

/* предметы, которые можно убирать — ступень «считает предметами» */
.predmety{display:flex;flex-wrap:wrap;gap:clamp(8px,1.6vw,16px);justify-content:center;
  padding:clamp(10px,2vh,20px);background:var(--list-2);border-radius:24px;
  /* 🚨 Со вторым десятком предметов стало до двадцати, и на телефоне
     кучка выталкивала варианты ответа за нижний край экрана. Ограничиваем
     высоту и ужимаем предметы, когда их много. */
  max-height:34vh;overflow:hidden;align-content:center}
.predmety.mnogo{gap:clamp(5px,1vw,9px)}
.predmety.mnogo .yagoda{width:clamp(26px,4.2vw,42px);height:clamp(26px,4.2vw,42px)}
/* Голос говорит «ягодка» — значит на экране должна быть ягодка,
   а не красный круг. Хвостик с листиком и блик: ребёнок узнаёт предмет
   раньше, чем разберёт слово. */
/* 🚨 Не мельче 48 px: это палец шестилетки, а не курсор. На телефоне
   ягодки выходили 38 px, и ребёнок промахивался бы по цели, которую
   надо тронуть восемь раз подряд. Поймано проверкой 29.08. */
/* 🚨 ПЯТЬ РАЗНЫХ ПРЕДМЕТОВ вместо одних ягод. Живая проба 10.09:
   «кроме орешков ягодок заданий больше нет — станет скучновато постоянно
   считать одни ягодки». Плюс речь говорила «орешки», а рисовались ягоды —
   ребёнок не понимал, что считать. Теперь предмет задаётся в задании,
   и голос называет ровно то, что нарисовано. */
.predmet{position:relative;width:clamp(48px,7vw,64px);height:clamp(48px,7vw,64px);
  border:none;background:none;cursor:pointer;transition:.25s;padding:0}
.predmet svg{width:100%;height:100%;display:block;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.28))}
.predmet.ubran{opacity:.25;transform:scale(.82)}
.predmety.mnogo .predmet{width:clamp(34px,4.6vw,46px);height:clamp(34px,4.6vw,46px)}

.yagoda{position:relative;width:clamp(48px,7vw,64px);height:clamp(48px,7vw,64px);
  border-radius:50%;background:var(--yagoda);border:none;cursor:pointer;
  transition:.25s;box-shadow:var(--ten)}
.yagoda::before{content:'';position:absolute;left:50%;top:-16%;width:26%;height:26%;
  background:var(--moh);border-radius:60% 10% 60% 10%;transform:translateX(-50%) rotate(-18deg)}
.yagoda::after{content:'';position:absolute;left:22%;top:24%;width:22%;height:16%;
  background:rgba(255,255,255,.55);border-radius:50%;transform:rotate(-25deg)}
.yagoda.syedena{opacity:.2;transform:scale(.7);pointer-events:none;box-shadow:none}
.gotovo{align-self:center;background:var(--moh);color:#fff;border:none;border-radius:999px;
  padding:14px 34px;font:inherit;font-family:Comfortaa;font-weight:700;
  font-size:clamp(15px,2vw,20px);cursor:pointer;box-shadow:var(--ten)}
.gotovo:active{transform:translateY(3px);box-shadow:none}

/* образец перед заданием — только в обучении */
.obrazec{display:grid;place-items:center;gap:clamp(10px,2vh,18px)}
.obr-podpis{font-family:Comfortaa;font-weight:700;font-size:clamp(15px,2vw,19px);color:var(--tihiy)}
.obr-slog{position:relative;display:flex;gap:clamp(18px,4vw,44px);align-items:center;
  padding-bottom:26px}
.obr-b{font-family:Nunito;font-weight:900;font-size:clamp(46px,9vw,86px);color:var(--chernila);
  transition:color .25s,transform .25s}
.obr-b.tyanetsya{color:var(--yantar);transform:scale(1.14)}
.obr-doroga{position:absolute;left:0;right:0;bottom:6px;height:12px}
.obr-doroga i{position:absolute;top:0;width:12px;height:12px;border-radius:50%;
  background:var(--moh);display:block}
.obr-slovo{font-family:Nunito;font-weight:900;font-size:clamp(34px,6vw,60px);color:var(--chernila)}
.obr-slovo .tyanetsya{color:var(--yantar)}
.obr-slovo .pervaya{display:inline-block;transition:.25s}
.obr-slovo .pervaya.gorit{color:var(--yantar);transform:scale(1.25)}
/* 🚨 Счёт обязан ВЫГЛЯДЕТЬ счётом. Раньше предметы просто загорались
   слева направо и оставались гореть — ряд заполнялся полосой, и ребёнок
   на пробе 10.09 принял показ за загрузку: «показывает какую-то прогрузку».
   Теперь считаемый подпрыгивает и опускается с меткой, рядом растёт цифра,
   а лапка трогает каждый по очереди. */
.obr-schet{font-family:Nunito;font-weight:900;color:var(--yantar);
  font-size:clamp(46px,9vw,86px);line-height:1;min-width:1.4em;text-align:center}
.obr-schet.tik{animation:schet-tik .34s ease-out}
@keyframes schet-tik{0%{transform:scale(.55);opacity:.4}60%{transform:scale(1.18)}100%{transform:scale(1)}}
/* 🚨 Кучка В ДЕМОНСТРАЦИИ: собственные размеры и зазор. Стили
   `.v .kucha i` живут только внутри кнопки варианта, и здесь не
   применялись — предметы шли без ширины и без промежутка, сливаясь
   в сплошную полосу (замер 11.09). */
.obr-kucha{max-width:min(90%,420px);position:relative;
  display:flex;flex-wrap:wrap;gap:clamp(9px,1.8vw,17px);
  justify-content:center;align-items:flex-end}
.obr-kucha i{display:block;position:relative;border-radius:52% 52% 46% 46%;
  background:var(--oreh);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);
  width:clamp(26px,4vw,40px);height:clamp(29px,4.4vw,45px)}
.obr-kucha i::before{content:'';position:absolute;left:12%;right:12%;top:-8%;height:34%;
  background:var(--oreh-shapka);border-radius:50% 50% 30% 30%}

<script type="module">
import { ZVERI, KARTINKI, GALKA } from './zveri.js';
import { sozdatZamer } from './zamer.js';

const el = id => document.getElementById(id);

/* Имя выбранного зверя подставляется в реплики. Иначе голос говорит «Ёжик»,
   когда на экране лиса — Андрей поймал это на первом же прогоне. */
const IMENA = { yozh:'Ёжик', zayats:'Зайчик', lisa:'Лисичка', belka:'Белочка', medved:'Мишка' };
/* Родительный падеж: «У Ёжика было», а не «У Ёжик было». Так не говорит
   ни один человек, и ухо слышит в этом машину — половина ощущения
   «иишного голоса» бралась отсюда, а не из тембра. */
const IMENA_ROD = { yozh:'Ёжика', zayats:'Зайчика', lisa:'Лисички', belka:'Белочки', medved:'Мишки' };
const ZHENSKIY = new Set(['lisa','belka']);
/* Род согласуется: «Лисичка потеряла», а не «Лисичка потерял».
   Поймано полным прогоном — голос говорил в мужском роде про лису. */
const rech = t => {
  const zh = ZHENSKIY.has(moyZver);
  let s = String(t)
    .replace(/\{zverya\}/g, IMENA_ROD[moyZver] || 'Друга')
    .replace(/\{zver\}/g, IMENA[moyZver] || 'Друг')
    .replace(/\{on\}/g, zh ? 'она' : 'он')
    .replace(/\{a\}/g, zh ? 'а' : '');
  if (ZHENSKIY.has(moyZver)){
    /* 🚨 \b в JavaScript опирается на латиницу и с кириллицей не работает —
       та же ловушка, что была в обезличивании данных. Границу задаём вручную. */
    /* 🚨 БЕЗ «просмотра назад» в регулярке. Он появился в Safari только
       с версии 16.4, а на старом планшете это ошибка РАЗБОРА файла: браузер
       не читает скрипт целиком и не выполняет вообще ничего — экран пустой
       при живом заголовке. Поймано на живом iPad 31.08.
       Границу слова проверяем руками: так умеет любой браузер. */
    const GLAGOLY = ['потерял','хотел','нашёл','собрал','искал','забыл',
                     'перепутал','решил','устал'];
    const BUKVA = /[А-Яа-яЁё]/;
    GLAGOLY.forEach(function(glagol){
      let i = s.indexOf(glagol);
      while (i !== -1){
        const do_ = i > 0 ? s[i - 1] : '';
        const posle = s[i + glagol.length] || '';
        if (!BUKVA.test(do_) && !BUKVA.test(posle)){
          s = s.slice(0, i + glagol.length) + 'а' + s.slice(i + glagol.length);
          i = s.indexOf(glagol, i + glagol.length + 1);
        } else {
          i = s.indexOf(glagol, i + 1);
        }
      }
    });
  }
  return s;
};
let L = null, zamer = null, moyZver = 'yozh';
/* 🚨 Очереди заданий больше нет. Следующее задание выбирается ПОСЛЕ каждого
   ответа — по тому, что ребёнок уже показал (Lalilo: уровень пересчитывается
   после каждого ответа). Раньше одиннадцать заданий составлялись до начала
   захода и внутри не менялись: читающий по слогам ребёнок всё равно получал
   буквы, и до его настоящего потолка игра не доходила. */
let tekushee = null, vydano = 0, nachalo_zahoda = 0, rezhim = 'zamer';
/* 🚨 Таймеры показа держим списком и гасим при смене задания. Без этого
   отложенные подписи прошлого показа перезаписывали текущую: на экране
   «Дддом. Слышишь? Начинается на 9» — девятка прилетела от счёта орешков,
   который считал вслух в предыдущем задании. */
let tikiObrazca = [];
const cherezObrazec = (f, ms) => tikiObrazca.push(setTimeout(f, ms));

/* 🚨 ПРЕДМЕТЫ ДЛЯ СЧЁТА. Пять видов вместо одних ягод — иначе ребёнку

   Формы простые и узнаваемые с одного взгляда — шестилетка не должен

const PREDMETY = {
  yagoda: {imya:'ягодки', svg:
    `<svg viewBox="0 0 64 64"><circle cx="32" cy="38" r="21" fill="#D4574C"/>
     <ellipse cx="25" cy="31" rx="6" ry="4" fill="#E8877D" opacity=".7"/>
     <path d="M32 18 q0-9 9-11 q2 8-9 11z" fill="#5B8C43"/>
     <path d="M32 18 v-6" stroke="#6B4A2A" stroke-width="3" stroke-linecap="round"/></svg>`},
  oreshek: {imya:'орешки', svg:
    `<svg viewBox="0 0 64 64"><ellipse cx="32" cy="40" rx="18" ry="20" fill="#C89A5B"/>
     <ellipse cx="26" cy="34" rx="5" ry="7" fill="#DCB57C" opacity=".7"/>
     <path d="M14 26 q18-10 36 0 q-2 6-18 6 q-16 0-18-6z" fill="#8B6234"/>
     <path d="M32 20 v-6" stroke="#6B4A2A" stroke-width="3" stroke-linecap="round"/></svg>`},
  gribok: {imya:'грибочки', svg:
    `<svg viewBox="0 0 64 64"><rect x="26" y="34" width="12" height="20" rx="5" fill="#EADFC8"/>
     <path d="M8 34 q4-22 24-22 q20 0 24 22 z" fill="#C0503F"/>
     <circle cx="20" cy="26" r="4" fill="#F2E6D0"/><circle cx="34" cy="21" r="5" fill="#F2E6D0"/>
     <circle cx="45" cy="28" r="3.5" fill="#F2E6D0"/></svg>`},
  shishka: {imya:'шишки', svg:
    `<svg viewBox="0 0 64 64"><ellipse cx="32" cy="36" rx="16" ry="22" fill="#8B6234"/>
     <path d="M32 16 l-9 9 9 8 9-8z" fill="#A87A45"/>
     <path d="M32 30 l-11 9 11 9 11-9z" fill="#A87A45"/>
     <path d="M32 46 l-8 7 8 6 8-6z" fill="#A87A45"/></svg>`},
  yabloko: {imya:'яблочки', svg:
    `<svg viewBox="0 0 64 64"><path d="M32 20 q-16-4-18 14 q-2 18 18 24 q20-6 18-24 q-2-18-18-14z" fill="#C0503F"/>
     <ellipse cx="24" cy="30" rx="5" ry="7" fill="#E08A7A" opacity=".6"/>
     <path d="M32 20 v-7" stroke="#6B4A2A" stroke-width="3" stroke-linecap="round"/>
     <path d="M33 15 q8-4 10 2 q-7 3-10-2z" fill="#5B8C43"/></svg>`},
};

/** Рисует предмет задания. Если вид не задан — ягодка, как раньше. */
function risunokPredmeta(vid){
  return (PREDMETY[vid] || PREDMETY.yagoda).svg;
}
function pogasitObrazec(){ tikiObrazca.forEach(clearTimeout); tikiObrazca = []; }
let nachato = 0, popytok = 0, podskazok = 0, sobrano = [];
let yagod = 0;   // награда за заход: копится и видна сразу

function dobavitYagodu(){
  yagod++;
  const k = el('korzinka');
  k.classList.remove('pusto');
  const i = document.createElement('i');
  k.insertBefore(i, k.querySelector('.schet'));
  k.querySelector('.schet').textContent = yagod;
  // больше пяти значков не показываем — иначе полоса разъедется
  const znachki = k.querySelectorAll('i');
  if (znachki.length > 5) znachki[0].remove();
}
let tikPovtor = null, tikPokaz = null;

/* ── голос: файлами, а не синтезом ─────────────────────────────────
   Голос выбран измерением: Ксения, 255 Гц и разброс интонации 62 —
   самый высокий и вдвое живее остальных. Исследование говорит, что речь
   к детям отличается повышенным тоном и интонационным разнообразием.

   🚨 Синтез на лету не используем совсем: в браузере русский голос ровно
   один, системный, и на планшете ребёнка он может звучать иначе или
   отсутствовать. Ребёнок должен слышать ОДИН И ТОТ ЖЕ голос всегда.

   На планшете звук не запускается до первого касания — поэтому первый
   экран это выбор зверька, он же разблокировка. */
let zvukGotov = false;
const KESH = new Map();

/* 🚨 Формат звука подбираем ПОД БРАУЗЕР. Safari не умеет opus: на планшете
   стояла полная тишина, и никакой ошибки не было — файл грузится, а
   проиграть браузер его не может. Поймано на живом iPad 31.08.
   m4a понимают все; opus легче, поэтому там, где он играет, берём его. */
const PROBA_ZVUKA = document.createElement('audio');
const UMEET_OPUS = !!(PROBA_ZVUKA.canPlayType &&
                      PROBA_ZVUKA.canPlayType('audio/ogg; codecs="opus"'));
const FORMAT_ZVUKA = UMEET_OPUS ? 'opus' : 'm4a';
/* 🚨 Замедление 0,905 вводилось под озвучку HeyGen: она синтезировалась
   на скорости 1,16 и была быстровата для шестилетки.
   Голос Инны записан ЖИВЬЁМ, темп естественный — 3,25 слога в секунду
   против 4,12 у прежней (замер 03.09). Замедлять его нельзя: речь поплывёт.
   Если на приёмке покажется медленно, поднимать до 1.05–1.1, не ниже 1.0. */
/* Замедление уже вшито в сами файлы при переносе (atempo=0.95,
   выбор Андрея 04.09). Здесь трогать нечего. */
const TEMP_RECHI = 1.0;

function zvuk(kod){
  if (!kod) return null;
  if (!KESH.has(kod)){
    const a = new Audio(`./ozvuchka/${kod}.${FORMAT_ZVUKA}`);
    a.preload = 'auto';
    // 🚨 Замедление БЕЗ переозвучки. Файлы синтезированы на скорости 1.16,
    // на живой пробе 31.08 это оказалось быстровато для шестилетки.
    // Браузер замедляет, сохраняя высоту голоса (preservesPitch), — то есть
    // голос остаётся тем же, который одобрила семья, а темп падает до ~1.05.
    a.playbackRate = TEMP_RECHI;
    if ('preservesPitch' in a) a.preservesPitch = true;
    if ('mozPreservesPitch' in a) a.mozPreservesPitch = true;
    if ('webkitPreservesPitch' in a) a.webkitPreservesPitch = true;
    KESH.set(kod, a);
  }
  return KESH.get(kod);
}

function razblokirovat(){
  if (zvukGotov) return;
  // молчаливое касание разблокирует воспроизведение на планшете
  const a = zvuk('molodec');
  if (a){ a.volume = 0; a.play().then(()=>{ a.pause(); a.currentTime = 0; a.volume = 1; }).catch(()=>{}); }
  zvukGotov = true;
}

let igraet = null;
/* Номер последней запущенной реплики. Нужен страховке в skazatIDalshe:
   если реплику сменила другая, старая страховка обязана молчать, иначе
   она погонит экран вперёд поверх нового звука (поймано слежкой 11.09). */
let nomerZvuka = 0;
/* 🚨 skazat зовёт kogdaKonchit, когда реплика ДОГОВОРЕНА до конца.
   Живая проба 10.09: «не привет, а приве» — слова обрывались на полбуквы.
   Причина найдена замером 11.09: автоповтор заводился через 6 с ОТ НАЧАЛА
   реплики, а 219 реплик из 1164 длиннее шести секунд (самая длинная 9,0 с).
   Фраза перебивала сама себя на полуслове. Теперь и повтор, и подсказка
   отсчитываются от КОНЦА звучания. Если файла нет или браузер не пустил
   звук — зовём сразу, иначе экран замрёт навсегда. */
function skazat(kod, kogdaKonchit){
  if (igraet){ try{ igraet.pause(); igraet.currentTime = 0; }catch(e){} igraet.onended = null; }
  const a = zvuk(kod);
  if (!a){ if (kogdaKonchit) kogdaKonchit(); return null; }
  igraet = a;
  nomerZvuka++;
  a.onended = () => { a.onended = null; if (kogdaKonchit) kogdaKonchit(); };
  try {
    a.currentTime = 0;
    const p = a.play();
    if (p && p.catch) p.catch(()=>{ a.onended = null; if (kogdaKonchit) kogdaKonchit(); });
  } catch(e){ a.onended = null; if (kogdaKonchit) kogdaKonchit(); }
  return a;
}

/* 🚨 Играет реплику и идёт дальше, КОГДА ОНА ДОГОВОРИЛА.
   Живая проба 10.09: «не привет, а приве». Слежка 11.09: 47 реплик
   из 57 за проход обрывались, потому что переходы шли по таймеру
   1,1–1,6 с, а реплики длятся до 9,1 с.
   `minimum` — сколько держать экран, даже если реплика короче: ребёнку
   нужно успеть увидеть, что ответ принят.
   Страховка обязательна: нет файла или браузер не пустил звук — экран
   не имеет права замереть навсегда. */
let perehodIdyot = false;                 // переход уже начат — второй ответ не считается
function skazatIDalshe(kod, minimum, dalshe){
  let ushli = false;
  perehodIdyot = true;
  const nachalo = performance.now();
  const puskay = () => { if (ushli) return; ushli = true; perehodIdyot = false; dalshe(); };
  const zvuk = skazat(kod, () => {
    const proshlo = performance.now() - nachalo;
    setTimeout(puskay, Math.max(0, minimum - proshlo));
  });
  /* 🚨 Если звук НЕ ПОШЁЛ — нет звукового устройства, файл не скачался,
     браузер не дал автозапуск, — ждать его конца бессмысленно: экран
     замирает на 12 секунд, и ребёнок решает, что игра сломалась.
     Через полторы секунды смотрим, двинулось ли воспроизведение; стоит
     на нуле — идём дальше по минимуму, молча. Поймано харнесом 11.09:
     прогоны перестали доходить до финала именно поэтому. */
  setTimeout(() => {
    if (!zvuk || !(zvuk.currentTime > 0.05)) puskay();
  }, Math.max(minimum, 1500));
  /* 🚨 Страховка срабатывает ТОЛЬКО если наша реплика всё ещё текущая.
     Без этой привязки отменённый переход просыпался через 12 с и гнал
     экран дальше, обрывая уже другую реплику. */
  const moy = nomerZvuka;
  setTimeout(() => { if (nomerZvuka === moy) puskay(); }, 12000);
}

/** Код реплики задания: со зверем или без. */
function kodRepliki(z){
  const bez = `${z.stupen.id}_${z.i % z.stupen.zadaniya.length}`;
  /* 🚨 Зверь есть в реплике не только как {zver}: появились падежные
     формы {zverya} и род {on}/{a}. Проверка на точное «{zver}» их
     не видела — игра искала файл без имени зверя, а озвучен он с именем.
     Две реплики про счёт молчали (поймано прогоном со звуком 30.08). */
  const est_zver = /\{zver\}|\{zverya\}|\{on\}|\{a\}/.test(z.zadanie.golos);
  return est_zver ? `${bez}_${moyZver}` : bez;
}

/** Случайный отклик на верный ответ. */
const OTKLIKI = ['da','verno','umnica','tochno'];
const otklik = () => OTKLIKI[Math.floor(Math.random()*OTKLIKI.length)];

/* ── автоповтор: ребёнок не должен искать выход, выход приходит сам ── */
/* 🚨 Заводить отсчёт ТОЛЬКО когда реплика договорена: иначе повтор
   рубит её на полуслове (см. skazat). Вызывается из onended. */
function zapustitPovtor(kod){
  clearTimeout(tikPovtor); clearTimeout(tikPokaz);
  const s = ((L && L.pravila && L.pravila.avtopovtor_sekund) || 6) * 1000;
  tikPovtor = setTimeout(()=>{
    /* повтор тоже ждёт своего конца, прежде чем заводить следующий */
    skazat(kod, () => zapustitPovtor(kod));
    el('slushat').classList.add('zovyot');
  }, s);
  /* 🚨 Показ ответа — не раньше, чем ребёнок точно отвлёкся. Стояло s*2,
     то есть 12 секунд, при нашей же записанной норме «одно касание у детей
     4-6 лет ~14 с»: задумчивого ребёнка штрафовали по его же норме.
     Берём порог «долго думала» из правил лестницы. */
  const dolgo = ((L && L.pravila && L.pravila.dolgo_dumala_sekund) || 20) * 1000;
  tikPokaz  = setTimeout(()=>{ pokazatPodskazku(); }, dolgo);
}
function ostanovitPovtor(){
  clearTimeout(tikPovtor); clearTimeout(tikPokaz);
  el('slushat').classList.remove('zovyot');
}
function pokazatPodskazku(){
  podskazok++;                              // это уже настоящая подсказка: показали ответ
  const verniy = document.querySelector('[data-verno="1"]');
  if (verniy) verniy.animate(
    [{transform:'scale(1)'},{transform:'scale(1.09)'},{transform:'scale(1)'}],
    {duration:700, iterations:2});
}

/* ── старт ────────────────────────────────────────────────────── */
async function zagruzit(){
  const r = await fetch('./lestnica.json');
  L = await r.json();
  zamer = sozdatZamer(L);
  el('zveri-vybor').innerHTML = L.zveri.map(z =>
    `<button class="zver-karta" data-z="${z}" aria-label="Выбрать">${ZVERI[z]}</button>`).join('');
  el('zveri-vybor').querySelectorAll('.zver-karta').forEach(b =>
    b.onclick = () => { razblokirovat(); moyZver = b.dataset.z; nachat(); });
}

function nachat(){
  el('vhod').classList.remove('vidno');
  el('igra').classList.add('vidno');
  vydano = 0;
  nachalo_zahoda = performance.now();
  zamer.nachatZahod();
  pokazat();
}

function narisovatPut(){
  /* 🚨 Тропинка, а не точки. Точек стало 25 по числу заданий в заходе,
     и они не влезали в экран — страница ездила вбок (поймано харнесом).
     Полоска не разъезжается при любой длине захода, а для ребёнка это
     та же понятная метафора: идём по тропинке, вот сколько прошли. */
  const vsego = L.pravila.zadaniy_v_zahode || 25;
  const dolya = Math.min(1, vydano / vsego);
  el('put').innerHTML =
    `<div class="tropa"><i style="width:${(dolya * 100).toFixed(1)}%"></i></div>`;
}

function pokazat(){
  const sekund = (performance.now() - nachalo_zahoda) / 1000;
  if (zamer.hvatit(vydano, sekund)) return finish();

  /* 🚨 Два режима на одном экране. В ЗАМЕРЕ мы ищем уровень и молчим
     о правильности. В ОБУЧЕНИИ — сначала показываем, как надо, потом
     просим, и говорим, вышло или нет. Ребёнок должен видеть разницу
     с первой секунды: иначе платить не за что.
     План: plans/2026-08-30-obuchenie-ot-urovnya.md */
  rezhim = zamer.rezhim(vydano);
  let z = null;
  if (rezhim === 'uchim'){
    const kod = zamer.otstayushiyNavyk();
    const x = kod && zamer.stupenDlyaObucheniya(kod);
    if (x) z = zamer.sobratNaStupeni(x);
  }
  if (!z){ rezhim = 'zamer'; z = zamer.sleduyushee(); }
  if (!z) return finish();             // ступени кончились — редкий случай
  tekushee = z;
  /* 🚨 Помечаем экран: измеряем мы сейчас или учим. Проверкам это нужно
     точно, а не по догадке о классе элемента: обучающие шаги (знакомство,
     немая артикуляция) идут в начале первого захода намеренно, и показ
     внутри них — часть механики, а не подсказка в замере. */
  document.body.dataset.izmeryaem = (!z.stupen.ne_zamer && rezhim === 'zamer') ? '1' : '0';
  document.body.dataset.stupen = z.stupen.id;
  narisovatPut();
  el('zver').innerHTML = ZVERI[moyZver];
  el('zver').className = 'zver zhdet';
  /* 🚨 Подпись показывает ТО, ЧТО СКАЗАЛ ЗВЕРЬ, а не название ступени.
     Раньше здесь стояло z.stupen.imya: взрослый видел слово «Знакомство»,
     три ягоды на экране — и не понимал, чего от ребёнка хотят. Ребёнок
     всё равно не читает, а рядом сидящий родитель обязан понимать игру
     с первого взгляда. Название ступени взрослый видит в карте. */
  el('podpis').textContent = rech(z.zadanie.golos);
  el('slushat').style.display = '';        // на прочих экранах кнопка нужна
  const kod = kodRepliki(z);
  /* 🚨 У немой артикуляции реплики нет вовсе: ребёнок читает по губам.
     Единственный экран игры, где зверь молчит намеренно. */
  if (z.stupen.tip !== 'nemaya'){
    /* отсчёт повтора и подсказки — от конца реплики, не от начала */
    skazat(kod, () => zapustitPovtor(kod));
  }
  perehodIdyot = false;                   // новый экран — снова принимаем ответы
  nachato = performance.now(); popytok = 0; podskazok = 0; sobrano = [];
  pogasitObrazec();
  el('stol').innerHTML = '';

  /* 🚨 В обучении зверь СНАЧАЛА ПОКАЗЫВАЕТ, и только потом просит.
     Ребёнок 6-7 лет не выполняет инструкцию, которой не видел: у Козыревой
     порядок жёсткий — сначала взрослый произносит слово с выделенным звуком,
     и лишь затем ребёнок называет звук сам. Показ — это и есть то, за что
     платят: в замере его нет и быть не должно. */
  if (rezhim === 'uchim' && OBRAZCY[z.stupen.id]){
    OBRAZCY[z.stupen.id](z, () => {
      nachato = performance.now();          // время считаем от НАЧАЛА задания
      el('stol').innerHTML = '';
      RISUEM[z.stupen.tip] ? RISUEM[z.stupen.tip](z) : RISUEM.vybor(z);
    });
    return;
  }
  RISUEM[z.stupen.tip] ? RISUEM[z.stupen.tip](z) : RISUEM.vybor(z);
}

/* ── Образцы: что зверь показывает перед заданием ──────────────────
   Приём для каждой ступени свой, взят из методики (план §2 и §3).
   Ключевое правило слияния: «М» и «А» не разделяются паузой — слог
   произносится за один раз (Горецкий). У Жуковой это «бегущий человечек»:
   первая буква тянется, пока палец идёт ко второй. */
/* Показ счёта: лапка трогает каждый предмет, цифра растёт.
   Возвращает, сколько миллисекунд занял весь показ, — чтобы вызывающий
   знал, когда переходить дальше, и не резал показ на полпути. */
function pokazatSchyot(korobka, predmety, kogdaKonchit){
  /* 🚨 380 мс — прежний темп счёта. Поднимал до 460, чтобы успевала
     лапка, но это растянуло показ и прогон перестал доходить до финала
     за отведённые шаги (харнес 11.09). Лапку ускорил вместо этого:
     переход 0,16 с, и на 380 мс она успевает. */
  const SHAG = 380;
  const cifra = document.createElement('div');
  cifra.className = 'obr-schet';
  cifra.textContent = '';
  korobka.parentNode.insertBefore(cifra, korobka);

  const lapa = document.createElement('img');
  lapa.className = 'obr-lapa';
  lapa.src = './risunki/lapa.svg';
  lapa.alt = '';
  lapa.style.opacity = '0';
  korobka.appendChild(lapa);

  predmety.forEach((o, i) => cherezObrazec(() => {
    /* лапка встаёт под предмет — считаем ПАЛЬЦЕМ, как учит методика */
    const r = o.getBoundingClientRect(), k = korobka.getBoundingClientRect();
    lapa.style.opacity = '1';
    lapa.style.left = (r.left - k.left + r.width / 2 - lapa.offsetWidth / 2) + 'px';
    lapa.style.top  = (r.top  - k.top  + r.height * 0.92) + 'px';
    o.classList.add('pryg');
    cherezObrazec(() => { o.classList.remove('pryg'); o.classList.add('tronut'); }, 360);
    cifra.textContent = i + 1;
    cifra.classList.remove('tik');
    void cifra.offsetWidth;             // перезапуск отрисовки
    cifra.classList.add('tik');
  }, SHAG * i));

  const vsego = SHAG * predmety.length;
  cherezObrazec(() => { lapa.style.opacity = '0'; }, vsego);
  if (kogdaKonchit) cherezObrazec(kogdaKonchit, vsego + 900);
  return vsego + 900;
}

const OBRAZCY = {
  slog(z, dalshe){
    const bukvy = z.zadanie.otvet;
    const d = document.createElement('div');
    d.className = 'obrazec';
    d.innerHTML = `
      <div class="obr-podpis">Смотри, как получается</div>
      <div class="obr-slog">
        <span class="obr-b" id="obr-1">${bukvy[0]}</span>
        <span class="obr-b" id="obr-2">${bukvy[1] || ''}</span>
        <div class="obr-doroga"><i id="obr-begun"></i></div>
      </div>`;
    el('stol').appendChild(d);
    el('podpis').textContent = `Смотри: ${bukvy.join('')} — вместе получается ${bukvy.join('')}`;

    /* Бегун едет от первой буквы ко второй; первая всё это время «тянется» —
       подсвечена, вторая загорается в момент прихода. */
    const begun = el('obr-begun');
    el('obr-1').classList.add('tyanetsya');
    begun.animate([{left:'4%'}, {left:'86%'}], {duration:1500, fill:'forwards', easing:'ease-in-out'});
    cherezObrazec(()=>{ el('obr-1').classList.remove('tyanetsya'); el('obr-2').classList.add('tyanetsya'); }, 1500);
    cherezObrazec(()=>{ el('obr-2').classList.remove('tyanetsya'); dalshe(); }, 2600);
  },

  /* Первый звук: зверь произносит слово, ТЯНУЯ начало. Изолированный звук
     не даём — по методике он всегда выделяется в слове (Эльконин, Козырева). */
  pervyy_zvuk(z, dalshe){
    const slovo = z.zadanie.vybor[z.zadanie.verno];
    const zvuk = slovo[0].toUpperCase();
    /* 🚨 Букву ПОДСВЕЧИВАЕМ, а не искажаем написание. Раньше здесь было
       «Дддом» — и синтез читал это как «дэ-дэ-дом», заикаясь (проверка
       30.08). Слово пишется правильно, первый звук выделяется цветом
       и размером в такт тому, как голос произносит слово дважды. */
    const d = document.createElement('div');
    d.className = 'obrazec';
    d.innerHTML = `
      <div class="obr-podpis">Слушай начало слова</div>
      <div class="obr-slovo"><span class="pervaya" id="obr-pervaya">${zvuk}</span>${slovo.slice(1)}</div>`;
    el('stol').appendChild(d);
    el('podpis').textContent = `${slovo[0].toUpperCase()}${slovo.slice(1)}. Начинается на ${zvuk}`;
    /* два мигания — ровно столько раз, сколько голос говорит слово */
    cherezObrazec(() => el('obr-pervaya').classList.add('gorit'), 250);
    cherezObrazec(() => el('obr-pervaya').classList.remove('gorit'), 950);
    cherezObrazec(() => el('obr-pervaya').classList.add('gorit'), 1300);
    cherezObrazec(() => el('obr-pervaya').classList.remove('gorit'), 2000);
    cherezObrazec(dalshe, 2500);
  },

  /* Буква — знак звука, а не сам звук (Эльконин). Показываем букву
     вместе со словом, где этот звук слышен. */
  bukvy(z, dalshe){
    const b = z.zadanie.vybor[z.zadanie.verno];
    /* 🚨 Буква и ПРЕДМЕТ рядом: «А — арбуз». Для нечитающего ребёнка
       буква сама по себе — закорючка; узнаваемая вещь даёт ей звук.
       Требование Андрея 31.08. Предметы отобраны в app/slova.py
       (PREDMET_K_BUKVE) — там же написано, что отвергнуто и почему. */
    const predmet = z.zadanie.predmet;
    /* 🚨 Тем же способом, что и звери (zveri.js): <picture> сам выбирает
       webp, а старый браузер берёт png. И БЕЗ object-fit — он требует
       Safari 10, а у Андрея «у кого-то ещё проще и старее айпады».
       Обычный img сохраняет пропорции сам, если задать только ширину. */
    const kartinka = predmet
      ? `<picture><source srcset="./risunki/${predmet}.webp" type="image/webp">
         <img class="obr-predmet" src="./risunki/${predmet}.png" alt=""
              draggable="false" decoding="async"></picture>`
      : '';
    const d = document.createElement('div');
    d.className = 'obrazec';
    d.innerHTML = `
      <div class="obr-podpis">Эта буква</div>
      <div class="obr-para">
        <span class="obr-b krupno tyanetsya">${b}</span>
        ${kartinka}
      </div>`;
    el('stol').appendChild(d);
    el('podpis').textContent = z.zadanie.slovo
      ? `${b} — как в слове «${z.zadanie.slovo}». Найди такую же букву`
      : `Это буква ${b}. Найди такую же`;
    cherezObrazec(dalshe, 2400);
  },

  /* Пересчёт: зверь считает вслух, трогая каждый орешек по очереди —
     соотнесение один к одному, без него счёт остаётся заучиванием. */
  pereschet(z, dalshe){
    const skolko = z.zadanie.skolko;
    const d = document.createElement('div');
    d.className = 'obrazec';
    d.innerHTML = `<div class="obr-podpis">Считаем вместе</div>
      <div class="kucha obr-kucha">${'<i class="m"></i>'.repeat(skolko)}</div>`;
    el('stol').appendChild(d);
    el('podpis').textContent = 'Смотри, как считают: трогаем каждый и называем число';
    const kucha = d.querySelector('.obr-kucha');
    const orehi = [...kucha.querySelectorAll('i')];
    pokazatSchyot(kucha, orehi, () => {
      el('podpis').textContent = `Всего ${skolko}`;
      dalshe();
    });
  },

  /* 🚨 Немая артикуляция — ЕДИНСТВЕННЫЙ экран без звука.
     Жукова, с. 6: «Поочерёдно сложив свои губы в немой артикуляции звуков
     а, у, о, попросите ребёнка угадать, какую букву вы назвали».
     Рот рисуется формой: для [а] широко открыт, для [у] вытянут трубочкой,
     для [о] круглый. Ребёнок читает по губам, а не по слуху — второй канал
     для того, кто путает звуки на слух. */
  nemaya(z, dalshe){
    /* Форма губ для каждого звука своя НЕ размером, а рисунком:
       [а] — рот распахнут, видны язык и тёмная глубина;
       [о] — ровное кольцо губ средней толщины;
       [у] — маленькое отверстие с ТОЛСТЫМИ вытянутыми губами.
       Раньше все три были одним эллипсом разного размера: «трубочка»
       и «кружок» выглядели одинаково, и вся разница жила в подписи,
       которую шестилетка не читает. */
    const FORMY = {
      'а': {rx: 40, ry: 30, guba: 7,  podpis: 'рот широко открыт', yazyk: true},
      'о': {rx: 25, ry: 27, guba: 11, podpis: 'губы кружком',      yazyk: false},
      'у': {rx: 13, ry: 14, guba: 17, podpis: 'губы вытянуты трубочкой', yazyk: false},
    };
    const forma = FORMY[z.zadanie.rot] || FORMY['о'];
    const d = document.createElement('div');
    d.className = 'obrazec';
    /* Лицо, а не пятно: волосы, брови, глаза с блеском, нос и щёки.
       Ребёнок должен узнать лицо с первого взгляда, иначе смотреть
       на губы ему просто не приходит в голову. */
    d.innerHTML = `<div class="obr-podpis">Смотри на губы</div>
      <svg viewBox="0 0 200 190" class="obr-rot">
        <ellipse cx="100" cy="104" rx="66" ry="76" fill="#F6D8BE"/>
        <path d="M34 92 Q38 26 100 24 Q162 26 166 92 Q150 60 118 54
                 Q92 76 34 92 Z" fill="#7A4A2B"/>
        <ellipse cx="34" cy="112" rx="9" ry="13" fill="#F0C9AA"/>
        <ellipse cx="166" cy="112" rx="9" ry="13" fill="#F0C9AA"/>
        <path d="M54 88 Q70 78 86 87" stroke="#7A4A2B" stroke-width="6"
              fill="none" stroke-linecap="round"/>
        <path d="M114 87 Q130 78 146 88" stroke="#7A4A2B" stroke-width="6"
              fill="none" stroke-linecap="round"/>
        <ellipse cx="70" cy="106" rx="11" ry="12" fill="#FFF"/>
        <ellipse cx="130" cy="106" rx="11" ry="12" fill="#FFF"/>
        <circle cx="71" cy="107" r="6" fill="#4A3B32"/>
        <circle cx="131" cy="107" r="6" fill="#4A3B32"/>
        <circle cx="73" cy="104" r="2" fill="#FFF"/>
        <circle cx="133" cy="104" r="2" fill="#FFF"/>
        <path d="M100 116 Q94 130 102 133" stroke="#D9A883" stroke-width="5"
              fill="none" stroke-linecap="round"/>
        <ellipse cx="52" cy="132" rx="10" ry="7" fill="#F2B49B" opacity=".6"/>
        <ellipse cx="148" cy="132" rx="10" ry="7" fill="#F2B49B" opacity=".6"/>
        <g id="obr-guby" transform="translate(100 152)">
          <ellipse rx="4" ry="3" fill="#5E2B27"
                   stroke="#D98A78" stroke-width="4"/>
        </g>
      </svg>`;
    el('stol').appendChild(d);
    el('podpis').textContent = `Беззвучно: ${forma.podpis}`;
    /* 🚨 Кнопка «Послушать» здесь повторяет ИНСТРУКЦИЮ, а не букву.
       Прятать её нельзя: ребёнок, прослушавший задание, остаётся один
       на один с молчащим экраном и не знает, чего от него хотят. */
    el('slushat').style.display = '';

    const guby = el('obr-guby');
    /* Губы вырастают в свою форму: рисунок ставим сразу, а показываем
       ростом от сомкнутых — так видно САМО ДВИЖЕНИЕ рта, а не итог. */
    const yazyk = forma.yazyk
      ? `<path d="M ${-forma.rx * 0.5} ${forma.ry * 0.35}
                  Q 0 ${forma.ry * 0.95} ${forma.rx * 0.5} ${forma.ry * 0.35} Z"
               fill="#C86A6A"/>` : '';
    guby.innerHTML = `
      <ellipse rx="${forma.rx}" ry="${forma.ry}" fill="#5E2B27"
               stroke="#D98A78" stroke-width="${forma.guba}"/>
      ${yazyk}`;
    guby.animate([{transform: 'translate(100px,152px) scale(.25)'},
                  {transform: 'translate(100px,152px) scale(1)'}],
                 {duration: 900, fill: 'forwards', easing: 'ease-out'});

    /* 🚨 Инструкция ЗВУЧИТ, немой остаётся только буква. У Жуковой
       (с. 6) взрослый вслух просит угадать и лишь потом складывает губы
       беззвучно — просьба голосом есть часть приёма, а не нарушение. */
    skazat('nemaya_vstup', () => zapustitPovtor('nemaya_vstup'));
    cherezObrazec(dalshe, 2600);
  },

  /* Похожие буквы: показываем обе рядом и различие — не «запомни»,
     а «смотри, чем отличаются». Смешение Б/Д, Ш/Щ, И/Й — типичное,
     и лечится оно сравнением, а не заучиванием. */
  pohozhie_bukvy(z, dalshe){
    const pravilnaya = z.zadanie.vybor[z.zadanie.verno];
    const drugaya = z.zadanie.vybor.find(b => b !== pravilnaya) || '';
    const d = document.createElement('div');
    d.className = 'obrazec';
    d.innerHTML = `<div class="obr-podpis">Смотри, чем отличаются</div>
      <div class="obr-slog">
        <span class="obr-b tyanetsya">${pravilnaya}</span>
        <span class="obr-b" style="opacity:.35">${drugaya}</span>
      </div>`;
    el('stol').appendChild(d);
    el('podpis').textContent = `Нам нужна ${pravilnaya}. Рядом похожая ${drugaya} — но она другая`;
    cherezObrazec(dalshe, 2400);
  },

  /* Слово: сначала по складам, потом целиком. Порядок из букварей —
     склад читается за один раз, а целое слово собирается из складов. */
  slovo3(z, dalshe){ pokazSlova(z, dalshe); },
  slovo4(z, dalshe){ pokazSlova(z, dalshe); },

  /* Цифра и количество: цифра и столько же предметов рядом. Это самая
     прогностичная ступень по данным на русских первоклассниках (iPIPS,
     связь с итогом года 0,72) — показываем её особенно наглядно. */
  cifra_kolichestvo(z, dalshe){
    const n = z.zadanie.cifra;
    const d = document.createElement('div');
    d.className = 'obrazec';
    d.innerHTML = `<div class="obr-podpis">Цифра и столько же орешков</div>
      <div class="obr-para">
        <span class="obr-cifra">${n}</span>
        <div class="kucha obr-kucha">${'<i class="m"></i>'.repeat(n)}</div>
      </div>`;
    el('stol').appendChild(d);
    el('podpis').textContent = `Цифра ${n} — это ${n} орешков`;
    const kucha = d.querySelector('.obr-kucha');
    pokazatSchyot(kucha, [...kucha.querySelectorAll('i')], dalshe);
  },

  /* Больше/меньше: зверь пересчитывает ОБЕ кучки. Иначе ребёнок решает
     «на глаз», а задание как раз построено на конфликте: где предметов
     больше, там они мельче. */
  bolshe_menshe(z, dalshe){
    const [a, b] = z.zadanie.kuchki;
    const d = document.createElement('div');
    d.className = 'obrazec';
    d.innerHTML = `<div class="obr-podpis">Считаем обе кучки</div>
      <div class="obr-para">
        <div class="kucha obr-kucha">${'<i class="m"></i>'.repeat(a)}</div>
        <div class="kucha obr-kucha">${'<i class="m"></i>'.repeat(b)}</div>
      </div>`;
    el('stol').appendChild(d);
    el('podpis').textContent = `Слева ${a}, справа ${b}. Больше там, где числа больше`;
    cherezObrazec(dalshe, 2600);
  },

  /* Считает предметами: зверь убирает съеденные и пересчитывает остаток.
     Опору не отнимаем — её перерастают (Монтессори: «переход к абстракции»
     это отдельный материал, а не запрет считать предметами). */
  schet_predmetami(z, dalshe){
    const bylo = z.zadanie.bylo, ubrat = z.zadanie.ubrat;
    const d = document.createElement('div');
    d.className = 'obrazec';
    d.innerHTML = `<div class="obr-podpis">Убираем и считаем, сколько осталось</div>
      <div class="predmety obr-predmety">${'<div class="yagoda"></div>'.repeat(bylo)}</div>`;
    el('stol').appendChild(d);
    el('podpis').textContent = `Было ${bylo}. Убираем ${ubrat}`;
    const yagody = [...d.querySelectorAll('.yagoda')];
    yagody.slice(0, ubrat).forEach((y, i) =>
      cherezObrazec(() => y.classList.add('syedena'), 300 * (i + 1)));
    cherezObrazec(() => { el('podpis').textContent = `Осталось ${bylo - ubrat}`; }, 300 * (ubrat + 1));
    cherezObrazec(dalshe, 300 * (ubrat + 1) + 1000);
  },

  /* Откуда начинают читать: палец ведём слева направо. Это не знание,
     а привычка глаза — её показывают движением, а не словами. */
  tekst(z, dalshe){
    const d = document.createElement('div');
    d.className = 'obrazec';
    d.innerHTML = `<div class="obr-podpis">Читают вот так</div>
      <div class="obr-stroka"><span>мама</span><span>мыла</span><span>раму</span>
        <i class="obr-palec" id="obr-palec"></i></div>`;
    el('stol').appendChild(d);
    el('podpis').textContent = 'Слева направо: начинаем с первого слова';
    const palec = el('obr-palec');
    palec.animate([{left:'0%'}, {left:'92%'}], {duration:2000, fill:'forwards', easing:'ease-in-out'});
    cherezObrazec(dalshe, 2600);
  },

  /* Понимает прочитанное: показываем слово и картинку вместе — связь
     «написанное значит вот это» и есть смысл чтения. */
  ponimanie(z, dalshe){
    const d = document.createElement('div');
    d.className = 'obrazec';
    d.innerHTML = `<div class="obr-podpis">Слово и то, что оно значит</div>
      <div class="obr-para">
        <span class="obr-slovo">КОТ</span>
        <div style="width:clamp(70px,12vh,120px)">${KARTINKI['кот'] || ''}</div>
      </div>`;
    el('stol').appendChild(d);
    el('podpis').textContent = 'Прочитали слово — и сразу понятно, про что оно';
    cherezObrazec(dalshe, 2400);
  },

  /* Досчитывает вперёд: не пересчитываем заново, а продолжаем от числа.
     Это следующая стратегия после «пересчитать всё» (Baroody). */
  doschet_vpered(z, dalshe){
    const ot = z.zadanie.ot, dobavit = z.zadanie.otvet;
    const d = document.createElement('div');
    d.className = 'obrazec';
    d.innerHTML = `<div class="obr-podpis">Не считаем заново — продолжаем</div>
      <div class="obr-para"><span class="obr-cifra">${ot}</span>
        <div class="kucha obr-kucha" id="obr-dobavka"></div></div>`;
    el('stol').appendChild(d);
    el('podpis').textContent = `Было ${ot}. Дальше: ${ot + 1}…`;
    for (let i = 1; i <= dobavit; i++)
      cherezObrazec(() => {
        el('obr-dobavka').insertAdjacentHTML('beforeend', '<i class="m schitaem"></i>');
        el('podpis').textContent = `${ot + i}`;
      }, 420 * i);
    cherezObrazec(dalshe, 420 * (dobavit + 1) + 700);
  },

  /* Считает в уме: опору убираем не запретом, а показом — предметы
     появляются и исчезают, число остаётся. */
  bez_opory(z, dalshe){
    const d = document.createElement('div');
    d.className = 'obrazec';
    d.innerHTML = `<div class="obr-podpis">Считаем в уме</div>
      <div class="obr-slovo">${z.zadanie.primer}</div>`;
    el('stol').appendChild(d);
    el('podpis').textContent = 'Тут предметов нет — считаем в голове';
    cherezObrazec(dalshe, 2200);
  },

  /* Состав числа: две кучки складываются в одну. Показываем именно
     сложение кучек, а не пример — цифры тут вторичны. */
  sostav_chisla(z, dalshe){
    const cel = z.zadanie.cel;
    const a = Math.max(1, Math.floor(cel / 2)), b = cel - a;
    const d = document.createElement('div');
    d.className = 'obrazec';
    d.innerHTML = `<div class="obr-podpis">Две кучки вместе</div>
      <div class="obr-para">
        <div class="kucha obr-kucha">${'<i class="m"></i>'.repeat(a)}</div>
        <span class="obr-cifra">+</span>
        <div class="kucha obr-kucha">${'<i class="m"></i>'.repeat(b)}</div>
      </div>`;
    el('stol').appendChild(d);
    el('podpis').textContent = `${a} и ${b} — вместе ${cel}`;
    cherezObrazec(dalshe, 2600);
  },
};

/* Показ слова: сперва склады по очереди, потом слово целиком. */
/* 🚨 Звуки, которые можно ТЯНУТЬ, и те, что только щёлкают.
   От этого зависит скорость указки — см. pokazSlova ниже. */
const TYANUTSYA_ZVUKI = 'АУОИЫЭЕЁЮЯМНСХЛРВЗЖШЩФ';
const VZRYVNYE_ZVUKI  = 'ПТКБДГЦЧЙ';

function pokazSlova(z, dalshe){
  const slovo = z.zadanie.otvet.join('');
  const bukvy = slovo.split('');
  /* 🚨 Указка движется с РАЗНОЙ скоростью, и это не украшение.
     Варенцова дословно: «если некоторые согласные звуки можно тянуть
     голосом, то указкой нужно двигать медленно, по мере произнесения
     звука, а если их можно только интонационно подчёркивать голосом,
     то указка движется быстрее. Детям это объясняется так: „Звук
     произносим быстро, не тянем, мы не можем задерживаться в этом
     домике и переходим в другой“».
     Ребёнок видит разницу между [с-с-с] и [к] глазами, а не только
     на слух — и это ровно то различие, на котором строится слияние. */
  const dlitelnost = b => TYANUTSYA_ZVUKI.includes(b.toUpperCase()) ? 520
                        : VZRYVNYE_ZVUKI.includes(b.toUpperCase()) ? 200 : 360;
  const d = document.createElement('div');
  d.className = 'obrazec';
  d.innerHTML = `<div class="obr-podpis">Читаем по складам</div>
    <div class="obr-slovo" id="obr-tekst">` +
    bukvy.map((b, i) => `<span class="obr-bukva" id="obr-bk-${i}">${b}</span>`).join('') +
    `</div>`;
  el('stol').appendChild(d);
  el('podpis').textContent = `${slovo} — читаем по складам, потом целиком`;

  let kogda = 700;
  bukvy.forEach((b, i) => {
    const derzhim = dlitelnost(b);
    cherezObrazec(() => {
      const e = el('obr-bk-' + i);
      if (e){ e.classList.add('tyanetsya'); e.style.transitionDuration = derzhim + 'ms'; }
    }, kogda);
    cherezObrazec(() => { const e = el('obr-bk-' + i); if (e) e.classList.remove('tyanetsya'); },
                  kogda + derzhim);
    kogda += derzhim + 60;
  });
  /* потом слово целиком — так склады собираются в слово */
  cherezObrazec(() => { el('obr-tekst').classList.add('tyanetsya'); }, kogda + 250);
  cherezObrazec(() => { el('obr-tekst').classList.remove('tyanetsya'); }, kogda + 1150);
  cherezObrazec(dalshe, kogda + 1500);
}

/* Схему слова объясняем один раз за заход — на постороннем слове */
let pokazaliShemu = false;

/** Показ: слово КОТ раскладывается по домикам, указка идёт по звукам. */
function pokazatDomiki(dalshe){
  const primer = 'КОТ';
  const d = document.createElement('div');
  /* 🚨 Класс НЕ «obrazec»: это не показ ответа, а объяснение правил игры
     на постороннем слове. Показ ответа в замере запрещён, объяснение
     механики — нет, иначе ребёнок видит пустые клетки и не знает,
     что с ними делать. Харнес считает именно показы ответа. */
  d.className = 'pravila shema-obertka';
  d.innerHTML = `<div class="obr-podpis">У каждого звука свой домик</div>
    <div class="shema" id="obr-domiki">` +
    primer.split('').map((b, i) =>
      `<div class="kletka pokaz" id="obr-dom-${i}"><span id="obr-zv-${i}"></span></div>`).join('') +
    `</div>`;
  el('stol').appendChild(d);
  el('podpis').textContent = 'Смотри: КОТ — три звука, три домика';
  let kogda = 600;
  primer.split('').forEach((b, i) => {
    const derzhim = TYANUTSYA_ZVUKI.includes(b) ? 520 : 200;
    cherezObrazec(() => {
      const dom = el('obr-dom-' + i), zv = el('obr-zv-' + i);
      if (dom) dom.classList.add('gorit');
      if (zv) zv.textContent = b;
    }, kogda);
    cherezObrazec(() => { const dom = el('obr-dom-' + i); if (dom) dom.classList.remove('gorit'); },
                  kogda + derzhim);
    kogda += derzhim + 120;
  });
  cherezObrazec(() => { el('stol').innerHTML = ''; dalshe(); }, kogda + 700);
}

/* ── как рисуется каждый тип задания ──────────────────────────── */
const RISUEM = {
  vybor(z){
    const d = document.createElement('div'); d.className='varianty';
    z.zadanie.vybor.forEach((v,i)=>{
      const b=document.createElement('button');
      b.className='v'+(String(v).length>2?' slovo':'');
      b.textContent=v; b.dataset.verno = i===z.zadanie.verno ? '1':'0';
      b.setAttribute('aria-label', String(v));
      b.onclick=()=>otvet(b, i===z.zadanie.verno, z);
      d.appendChild(b);
    });
    el('stol').appendChild(d);
  },
  pokazat_bukvu(z){ RISUEM.vybor(z); },

  /* 🚨 Схема слова: столько клеток, сколько в слове звуков. Ребёнок жмёт
     клетку, где слышит звук — начало, середина или конец.
     Определение места звука входит в задачи подготовительной группы
     (ФОП ДО, звуковая аналитико-синтетическая активность).

     Звук показан БУКВОЙ над схемой, а не назван голосом: синтез читает
     «Х» как «икс», «С» как «эс» — ребёнок услышал бы название буквы
     вместо звука. Голос произносит только слово, дважды. */
  shema_slova(z){
    const zad = z.zadanie;
    /* 🚨 Схема слова — новая для ребёнка вещь: пустые клетки сами по себе
       ничего не говорят. Один раз за заход показываем, как слово ложится
       по домикам, — НА ДРУГОМ СЛОВЕ. Так механика объяснена, а ответ
       текущего задания не подсказан, и замер остаётся замером.
       «Звук произносим быстро, не тянем, мы не можем задерживаться
       в этом домике и переходим в другой» (Варенцова). */
    if (!pokazaliShemu){
      pokazaliShemu = true;
      pokazatDomiki(() => RISUEM.shema_slova(z));
      return;
    }
    const obertka = document.createElement('div');
    obertka.className = 'shema-obertka';
    obertka.innerHTML = `<div class="shema-zvuk">${zad.zvuk}</div>`;
    const ryad = document.createElement('div');
    ryad.className = 'shema';
    for (let i = 0; i < zad.shema; i++){
      const kl = document.createElement('button');
      kl.className = 'kletka';
      kl.dataset.verno = i === zad.verno ? '1' : '0';
      kl.setAttribute('aria-label', 'клетка ' + (i + 1));
      kl.onclick = () => otvet(kl, i === zad.verno, z);
      ryad.appendChild(kl);
    }
    obertka.appendChild(ryad);
    el('stol').appendChild(obertka);
  },
  pokazat(z){ RISUEM.vybor(z); },
  /* 🚨 Устройство текста показываем НАСТОЯЩЕЙ строкой, а не словами
     «первое / среднее / последнее» — ребёнок их не прочитает. Он тыкает
     в само слово, и для этого читать не нужно. */
  /* Обучающий шаг. Ребёнок понимает правила игры ДО того, как мы начали
     считать. Ошибиться невозможно, в замер не идёт. */
  znakomstvo(z){
    const d = document.createElement('div');
    d.className = 'varianty';
    [1, 2, 3].forEach(n => {
      const b = document.createElement('button');
      b.className = 'v';
      const r = 26 + n * 16;
      b.innerHTML = `<div class="yagoda" style="width:${r}px;height:${r}px;pointer-events:none"></div>`;
      b.dataset.verno = n === 3 ? '1' : '0';
      b.setAttribute('aria-label', 'Ягодка');
      /* 🚨 Проверяем, что нажали именно САМУЮ БОЛЬШУЮ. Раньше любая ягодка
         давала «Поехали!» — ребёнок жал маленькую и получал похвалу.
         Первое же действие в игре учило, что просьбу можно не слушать,
         и дальше ни одна инструкция ничего не значила. Отсюда и «мне
         непонятна логика заданий» на приёмке 29.08. */
      b.onclick = () => {
        if (n === 3){
          /* Знакомство идёт своим обработчиком, мимо otvet() — флаг
             «пройдено» ставим здесь, иначе правила игры показываются
             заново при каждом заходе. */
          zamer.obuchayushiyProyden(z.stupen.id);
          b.classList.add('verno');
          skazatIDalshe('poehali', 1100, () => { vydano++; pokazat(); });
        } else {
          b.classList.add('mimo');
          el('zver').className = 'zver dumaet';
          skazat('smotri');
          const bolshaya = d.querySelector('[data-verno="1"]');
          setTimeout(() => { if (bolshaya) bolshaya.classList.add('zovyot'); }, 700);
        }
      };
      d.appendChild(b);
    });
    el('stol').appendChild(d);
  },

  /* Показываем, КАК читают, и только потом спрашиваем. Без показа ребёнку
     неоткуда знать ответ — это была бы угадайка, а не замер.
     Андрей на первом прогоне: «откуда ребёнку знать, с какого слова начинают?» */
  stroka_teksta(z){
    const d = document.createElement('div');
    d.className = 'varianty stroka-teksta';
    if (z.zadanie.pokaz_snachala){
      // палец проходит по строке слева направо — показываем направление чтения
      setTimeout(() => {
        const slova = d.querySelectorAll('.v');
        slova.forEach((sl, i) => setTimeout(() => {
          sl.animate([{transform:'translateY(0)'},{transform:'translateY(-10px)'},{transform:'translateY(0)'}],
                     {duration:420});
        }, i * 380));
      }, 1200);
    }
    z.zadanie.stroka.forEach((slovo, i) => {
      const b = document.createElement('button');
      b.className = 'v slovo';
      b.textContent = slovo;
      b.dataset.verno = i === z.zadanie.verno ? '1' : '0';
      b.setAttribute('aria-label', 'Слово ' + slovo);
      b.onclick = () => otvet(b, i === z.zadanie.verno, z);
      d.appendChild(b);
    });
    el('stol').appendChild(d);
  },
  pokazat_kartinku(z){
    const d=document.createElement('div'); d.className='varianty';
    z.zadanie.vybor.forEach((v,i)=>{
      const b=document.createElement('button'); b.className='v';
      b.innerHTML = KARTINKI[v] || `<span style="font-size:22px">${v}</span>`;
      b.dataset.verno = i===z.zadanie.verno?'1':'0';
      b.setAttribute('aria-label', v);
      b.onclick=()=>otvet(b, i===z.zadanie.verno, z);
      d.appendChild(b);
    });

  },
  slovo_k_kartinke(z){
    const k=document.createElement('div');
    k.style.cssText='display:grid;place-items:center;margin-bottom:8px';
    k.innerHTML = `<div style="width:clamp(90px,15vh,150px)">${KARTINKI[z.zadanie.kartinka]||''}</div>`;
    el('stol').appendChild(k);
    RISUEM.vybor(z);
  },
  sobrat(z){
    const ok=document.createElement('div'); ok.className='okoshki';
    ok.innerHTML = z.zadanie.otvet.map((_,i)=>
      `<div class="okno ${i===0?'zhdet':''}" id="ok${i}"></div>`).join('');
    el('stol').appendChild(ok);
    const d=document.createElement('div'); d.className='varianty';
    z.zadanie.bukvy.forEach(bk=>{

      d.appendChild(b);
    });
    el('stol').appendChild(d);
  },
  nemaya(z){
    /* Задание немой артикуляции: сначала рот беззвучно складывает звук,
       потом появляются буквы на выбор. Показ и задание тут слиты в одно —
       поэтому рисуем сами, а не через OBRAZCY. */
    OBRAZCY.nemaya(z, () => {
      el('stol').innerHTML = '';
      RISUEM.vybor(z);
      el('podpis').textContent = 'Какую букву показали губы?';
