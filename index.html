  poschitat(z){
    const p=document.createElement('div'); p.className='predmety';
    if (z.zadanie.skolko > 10) p.classList.add('mnogo');
    /* 🚨 Рисуем ТО, ЧТО НАЗВАЛ ГОЛОС. Раньше речь говорила «орешки»,
       а на экране всегда были ягоды — ребёнок не понимал, что считать
       (живая проба 10.09). Вид предмета приходит в задании. */
    const risunok = risunokPredmeta(z.zadanie.predmet);
    p.innerHTML = Array.from({length:z.zadanie.skolko},()=>
      `<div class="predmet" style="pointer-events:none">${risunok}</div>`).join('');
    el('stol').appendChild(p);
    RISUEM.vybor(z);
  },
  cifra_k_kuchke(z){
    const c=document.createElement('div');
    c.style.cssText='text-align:center;font-family:Nunito;font-weight:900;font-size:clamp(48px,9vw,86px)';
    c.textContent = z.zadanie.cifra;
    el('stol').appendChild(c);
    const d=document.createElement('div'); d.className='varianty';
    z.zadanie.vybor.forEach((n,i)=>{
      const b=document.createElement('button'); b.className='v';
      b.innerHTML = `<div class="kucha">${'<i class="m"></i>'.repeat(n)}</div>`;
      b.dataset.verno = i===z.zadanie.verno?'1':'0';
      b.setAttribute('aria-label', n+' штук');
      b.onclick=()=>otvet(b, i===z.zadanie.verno, z);
      d.appendChild(b);
    });
    el('stol').appendChild(d);
  },
  gde_bolshe(z){
    const d=document.createElement('div'); d.className='varianty';
    z.zadanie.kuchki.forEach((n,i)=>{
      const b=document.createElement('button'); b.className='v';
      const kl = z.zadanie.razmer[i]==='krupnye' ? 'b':'m';
      b.innerHTML = `<div class="kucha">${`<i class="${kl}"></i>`.repeat(n)}</div>`;
      b.dataset.verno = i===z.zadanie.verno?'1':'0';
      b.setAttribute('aria-label', n+' штук');
      b.onclick=()=>otvet(b, i===z.zadanie.verno, z);
      d.appendChild(b);
    });
    el('stol').appendChild(d);
  },
  /* 🚨 Ступень «считает предметами»: предметы обязаны быть на экране
     и их должно быть можно трогать. Убрать предметы — значит померить
     только счёт в уме и записать ноль тому, кто стоит на нижней ступени,
     а это нормальный уровень для шести лет (Baroody). */
  ubrat_predmety(z){
    const p=document.createElement('div'); p.className='predmety';
    p.innerHTML = Array.from({length:z.zadanie.bylo},(_,i)=>
      `<button class="yagoda" data-i="${i}" aria-label="Ягода"></button>`).join('');
    el('stol').appendChild(p);
    let ubrano = 0;
    p.querySelectorAll('.yagoda').forEach(y => y.onclick = () => {
      y.classList.add('syedena'); ubrano++;
      /* 🚨 Ждём, пока договорит текущая реплика: «Сколько осталось?»
       рубило вопрос задания на полуслове (слежка за звуком 11.09). */
    if (ubrano === z.zadanie.ubrat)
      setTimeout(()=>{ if (igraet && !igraet.paused && !igraet.ended)
                         igraet.onended = () => { igraet.onended = null; skazat('skolko'); };
                       else skazat('skolko'); }, 400);
    });
    const g=document.createElement('button'); g.className='gotovo'; g.textContent='Посчитал';
    g.onclick = () => {
      g.remove();
      const d=document.createElement('div'); d.className='varianty';
      const vse = [z.zadanie.otvet, z.zadanie.otvet+1, Math.max(0,z.zadanie.otvet-1)];
      vse.forEach(n=>{
        const b=document.createElement('button'); b.className='v'; b.textContent=n;
        b.dataset.verno = n===z.zadanie.otvet?'1':'0';
        b.onclick=()=>otvet(b, n===z.zadanie.otvet, z);
        d.appendChild(b);
      });
      el('stol').appendChild(d);
    };
    el('stol').appendChild(g);
  },
  doschitat(z){
    const c=document.createElement('div');
    c.style.cssText='text-align:center;font-family:Nunito;font-weight:900;font-size:clamp(30px,5vw,50px)';
    c.textContent = `${z.zadanie.ot} → ${z.zadanie.do}`;
    el('stol').appendChild(c);
    const d=document.createElement('div'); d.className='varianty';
    [z.zadanie.otvet, z.zadanie.otvet+1, Math.max(1,z.zadanie.otvet-1)].forEach(n=>{
      const b=document.createElement('button'); b.className='v'; b.textContent=n;
      b.dataset.verno = n===z.zadanie.otvet?'1':'0';
      b.onclick=()=>otvet(b, n===z.zadanie.otvet, z);
      d.appendChild(b);
    });
    el('stol').appendChild(d);
  },
  primer(z){
    const c=document.createElement('div');
    c.style.cssText='text-align:center;font-family:Nunito;font-weight:900;font-size:clamp(40px,7vw,70px)';
    c.textContent = z.zadanie.primer;
    el('stol').appendChild(c);
    RISUEM.vybor(z);
  },
  sobrat_chislo(z){
    const c=document.createElement('div');
    c.style.cssText='text-align:center;font-family:Comfortaa;font-size:clamp(20px,3vw,28px)';
    c.textContent = 'Нужно ' + z.zadanie.cel;
    el('stol').appendChild(c);
    const d=document.createElement('div'); d.className='varianty';
    z.zadanie.vybor.forEach((para,i)=>{
      const b=document.createElement('button'); b.className='v';
      b.innerHTML = `<div style="font-size:clamp(20px,3vw,30px)">${para[0]} + ${para[1]}</div>`;
      b.dataset.verno = i===z.zadanie.verno?'1':'0';
      b.onclick=()=>otvet(b, i===z.zadanie.verno, z);
      d.appendChild(b);
    });
    el('stol').appendChild(d);
  }
};

function polozhit(knopka, bukva, z){
  ostanovitPovtor();
  const zhdem = z.zadanie.otvet[sobrano.length];
  if (bukva === zhdem){
    sobrano.push(bukva);
    knopka.classList.add('ushla');
    const o = el('ok'+(sobrano.length-1));
    o.textContent = bukva; o.classList.remove('zhdet'); o.classList.add('zanyato');
    const sled = el('ok'+sobrano.length);
    if (sled) sled.classList.add('zhdet');
    if (sobrano.length === z.zadanie.otvet.length) otvet(null, true, z, true);
  } else {
    popytok++;
    /* 🚨 Не «ошибся», а «не подошло»: буква мягко возвращается на место,
       как деталь, не вошедшая в паз. Ни красного, ни реплики про ошибку —
       во время замера ребёнок не должен узнавать, верно ли он ответил
       (DoodleMaths, Prodigy). Отличие от «ошибка не наказывает»: там мы
       убирали упрёк, здесь убираем и сам сигнал. */
    knopka.classList.add('ne-podoshla');
    setTimeout(()=>knopka.classList.remove('ne-podoshla'), 450);
    /* 🚨 Выход обязателен. Без него ребёнок, который не может собрать,
       тыкает бесконечно — поймано полным прогоном 29.08. */
    if (popytok >= 3) otvet(null, false, z, true);
  }
}

/** Показывает сборку целиком, когда ребёнок не справился. Без записи. */
function pokazatSborku(z){
  z.zadanie.otvet.forEach((bk, i) => setTimeout(() => {
    const o = el('ok'+i);
    if (o){ o.textContent = bk; o.classList.remove('zhdet'); o.classList.add('zanyato'); }
    const knopki = [...document.querySelectorAll('.varianty .v')];
    const nuzhnaya = knopki.find(k => k.textContent === bk && !k.classList.contains('ushla'));
    if (nuzhnaya) nuzhnaya.classList.add('ushla');
  }, 500 + i*600));
  setTimeout(() => skazatIDalshe('vot_tak_dalshe', 900,
                                 () => { vydano++; pokazat(); }),
             700 + z.zadanie.otvet.length*600 + 900);
}

/* 🚨 Замер и обучение разведены во времени внутри одного экрана:
   ПЕРВОЕ касание — чистый замер, его пишем. Сразу после — зверь
   показывает правильное и даёт сделать правильно, уже БЕЗ записи.
   Так каждый экран кончается успехом, а данные остаются честными. */
/* konec = задание завершилось: слово собрано целиком либо попытки исчерпаны.
   🚨 Без этого признака ответ не записывался, когда ребёнок не справился со
   сборкой: событие не попадало в замер, номер задания не рос, и игра выдавала
   ТОТ ЖЕ слог снова и снова. Поймано прогоном 29.08 — пятьдесят повторов
   «Ёжик хочет сказать РА» подряд. */
function otvet(knopka, verno, z, konec){
  /* 🚨 Пока идёт переход, повторное нажатие НЕ считается ответом.
     Без этого каждое новое касание перезапускало ожидание конца реплики,
     и экран не уходил вовсе: прогон захода 11.09 сделал 56 кликов на одном
     задании и не сдвинулся. Ребёнок, который тычет по кнопке, — не
     выдумка, а норма для шести лет. */
  if (perehodIdyot) return;
  ostanovitPovtor();
  popytok++;
  const sekund = Math.round((performance.now() - nachato) / 1000);
  if (!z.stupen.ne_zamer && (popytok === 1 || konec)) {
    zamer.zapisat({ navyk: z.navyk, stupen: z.stupen.id, zadanie: z.i,
                    verno, sekund, podskazok, kogda: Date.now(),
                    /* выбирал из готовых вариантов или собирал ответ сам —
                       от этого зависит, сколько верных нужно для зачёта */
                    vybor: Array.isArray(z.zadanie.vybor),
                    versiya_lestnicy: L.versiya });
  }
  /* 🚨 ВО ВРЕМЯ ЗАМЕРА РЕБЁНОК НЕ УЗНАЁТ, ВЕРНО ЛИ ОТВЕТИЛ.
     DoodleMaths дословно: «Children will not know if they have answered
     questions correctly or incorrectly as they complete the baseline
     assessment». Prodigy: «Students don't know they're being tested».
     Причина простая: узнав про ошибку, ребёнок начинает подстраиваться —
     осторожничать, гадать, повторять удачное. Тогда мы меряем не знание,
     а реакцию на нашу же похвалу.

     Прогресс всё равно виден: ягодка даётся за КАЖДЫЙ ответ, как у Doodle
     полоска звёзд. Обучающие шаги (ne_zamer) — не замер, там обратная
     связь нужна и остаётся. */
  const idyot_zamer = !z.stupen.ne_zamer && rezhim === 'zamer';

  if (!idyot_zamer) zamer.obuchayushiyProyden(z.stupen.id);

  if (idyot_zamer){
    el('zver').className = 'zver rad';      // зверь рад, что ему помогли — любому ответу
    dobavitYagodu();
    /* 🚨 НЕЙТРАЛЬНЫЙ звук шага, а не похвала. Здесь стояло «Молодец!
       Поехали!» — и звучало после КАЖДОГО ответа, включая неверный.
       То есть обратную связь я не убрал, а заменил на ложную: дети до
       семи лет понимают похвалу буквально (Henderlong и Lepper, 2002),
       ребёнок слышал «Молодец» и делал вывод, что ответил верно.
       Похвала осталась только на обучающих шагах, где она честная. */
    skazatIDalshe('shag', 1100, ()=>{ vydano++; pokazat(); });
    return;
  }

  if (verno){
    if (knopka) knopka.classList.add('verno');
    el('zver').className = 'zver rad';
    dobavitYagodu();
    skazatIDalshe(otklik(), 1300, ()=>{ vydano++; pokazat(); });
  } else {
    if (knopka) knopka.classList.add('mimo');
    el('zver').className = 'zver dumaet';   // зверь задумался, а не осудил
    const verniy = document.querySelector('[data-verno="1"]');
    if (verniy){
      skazatIDalshe('smotri', 900, ()=>{
        verniy.classList.add('verno');
        skazat('vot_tak');
        verniy.onclick = () => skazatIDalshe('molodec', 1100,
                                             ()=>{ vydano++; pokazat(); });
      });
    } else skazatIDalshe('smotri', 1600, ()=>{ vydano++; pokazat(); });
  }
}

function finish(){
  ostanovitPovtor();
  narisovatPut();
  el('zver').innerHTML = ZVERI[moyZver];
  el('zver').className = 'zver rad';
  el('podpis').textContent = 'На сегодня всё. Приходи завтра!';
  /* 🚨 Было: число «22» и дюжина кружков. Ребёнок не читает — для него
     это ничего не значило (живая проба 10.09: «не ясно, что это число
     значит и что за шарики»). Стало: зверь держит КОРЗИНУ, в неё падают
     ягоды — ровно столько, сколько собрано, — и он прыгает от радости.
     Считать глазами не нужно: видно, что полная. */
  el('stol').innerHTML = `<div class="itog-zahoda">
      <div class="korzina" id="korzina">
        <!-- 🚨 Порядок важен: корзина рисуется ПЕРВОЙ (фоном), ягоды —
             поверх неё. Иначе SVG закрывает их целиком, и на экране
             пустая корзина (поймано снимком 11.09). -->
        <svg viewBox="0 0 200 130" class="korzina-svg" aria-hidden="true">
          <path d="M60 44 Q100 -2 140 44" fill="none" stroke="#A96C2C" stroke-width="9"/>
          <path d="M22 46 L178 46 L164 120 Q100 128 36 120 Z" fill="#C8873F"/>
          <path d="M22 46 L178 46 L175 58 L25 58 Z" fill="#A96C2C"/>
        </svg>
        <div class="korzina-yagody" id="korzina-yagody"></div>
      </div>
    </div>`;
  nasypatYagody(yagod);
  el('zver').classList.add('prygaet');
  /* 🚨 Сколько собрал — ГОЛОСОМ, а не цифрой: ребёнок не читает.
     Реплики записаны на каждое число (itog_1 … itog_30), после них
     общее «На сегодня всё. Приходи завтра!» */
  const kod_itoga = `itog_${Math.min(Math.max(yagod, 1), 30)}`;
  /* 🚨 «Вот целая корзина!» договаривается ДО конца, и только потом
     «На сегодня всё». Раньше второе стартовало по таймеру и рубило первое
     на полуслове, если ягод было мало и таймер срабатывал раньше. */
  const dosypka = 90 * Math.min(yagod, 30) + 400;
  skazat(kod_itoga, () => setTimeout(() => skazat('final'),
                                     Math.max(600, dosypka - 1200)));
}

/** Насыпает ягоды в корзину по одной — ребёнок видит, СКОЛЬКО собрал,
 *  не умея читать. Считать не обязательно: важно, что корзина полная.
 *  🚨 Больше 30 не сыплем: дальше куча визуально не растёт, а рисование
 *  сотни кружков тормозит старый планшет. */
function nasypatYagody(skolko){
  const gnezdo = el('korzina-yagody');
  if (!gnezdo) return;
  const vsego = Math.min(skolko, 30);
  gnezdo.innerHTML = '<i></i>'.repeat(vsego);
  const yagody = [...gnezdo.querySelectorAll('i')];
  yagody.forEach((y, i) => setTimeout(() => y.classList.add('upala'), 90 * i));
}

/* ── карта для родителя ───────────────────────────────────────── */
/* 🚨 Ручка уровня. Родители в отзывах просят её в двенадцать раз чаще, чем
   саму диагностику: 12 жалоб «нельзя сменить уровень» из 435 против одной
   просьбы про замер. Говорим словами жалобы, а не словами методики. */
function narisovatRuchku(){
  const bloki = Object.entries(L.navyki).map(([kod, nav]) => {
    const stupeni = zamer.stupeniNavyka(kod);
    const vybran = zamer.uroven()[kod];
    const knopki = stupeni.map((st, i) =>
      `<button data-navyk="${kod}" data-i="${i}" class="${i === vybran ? 'vybran' : ''}">${st.imya}</button>`).join('');
    return `<div class="navyk"><div class="imya">${nav.imya}</div>
              <div class="knopki">${knopki}</div></div>`;
  }).join('');

  el('ruchka').innerHTML = `
    <h3>С чего начинать</h3>
    <p>Если ребёнок это уже умеет — не заставляем начинать сначала.
       Отметьте, что он умеет сейчас, и следующий заход начнётся отсюда.
       Игра всё равно проверит сама и поправит, если промахнулись.</p>
    ${bloki}`;

  el('ruchka').querySelectorAll('button').forEach(b => b.onclick = () => {
    const kod = b.dataset.navyk, i = +b.dataset.i;
    /* Повторное нажатие снимает отметку — родитель может передумать. */
    const bylo = zamer.uroven()[kod];
    zamer.postavitUroven(kod, bylo === i ? null : i);
    narisovatRuchku();
  });
}

function sobratKartu(){
  narisovatRuchku();
  const it = zamer.itog();
  el('dop').textContent = it.vsego
    ? `Заходов: ${it.zahodov}. Ответов записано: ${it.vsego}.`
    : 'Пока пусто — нужен хотя бы один заход.';
  let h = '';
  for (const [kod, nav] of Object.entries(L.navyki)){
    h += `<div class="gruppa">${nav.imya}</div>`;
    for (const st of nav.stupeni){
      // Обучающий шаг в карту не идёт: он ничего не меряет, и строка
      // «не проверяли» висела бы у родителя вечно. Фильтр есть и в itog(),
      // но карта перебирает лестницу сама и подставляет заглушку — так
      // знакомство и просачивалось (поймано на карте 29.08).
      if (st.ne_zamer) continue;
      const s = it.stupeni[st.id] || { klass:'pusto', metka:'—', podpis:'не проверяли' };
      h += `<div class="stroka"><div class="t"><b>${st.imya}</b><span>${s.podpis}</span></div>
            <div class="m ${s.klass}">${s.metka}</div></div>`;
    }
  }
  el('stroki').innerHTML = h;
  el('snoska').innerHTML = '🚨 Это не оценка и не норма. Надёжных возрастных норм для ' +
    'шестилеток не существует, поэтому мы показываем только <b>что ребёнок умеет сейчас</b>, ' +
    'а не «отстаёт или нет». Каждая строка опирается на то, сколько раз задание предлагалось. ' +
    'Данные хранятся только на этом устройстве.';
}

/* 🚨 Точка для машинных проверок. Скрипт — модуль, изнутри наружу
   не видно ничего, а экраны обязаны проверяться замером, а не глазами.
   Наружу отдаём ТОЛЬКО отрисовку: ни замера, ни прогресса ребёнка. */
window.PROVERKA = {OBRAZCY, RISUEM};

el('slushat').onclick = () => {
  /* 🚨 На финале tekushee остаётся от последнего задания, и кнопка
     говорила про дым вместо «На сегодня всё». Поймано живой пробой 10.09:
     «нажимаю послушать, а она мне про дым говорит почему-то». */
  if (document.querySelector('.itog-zahoda')){ skazat('final'); return; }
  const z = tekushee;
  /* 🚨 Переслушать — НЕ подсказка. Здесь стояло podskazok++, а лесенка
     опускает ступень вниз при любом ответе с подсказкой: ребёнок, который
     не расслышал и нажал самую большую кнопку на экране, откатывался назад,
     даже ответив верно. Подсказкой считается только показ правильного
     ответа (pokazatPodskazku). Поймано критиком 29.08 прогоном lesenka.py. */
  /* На немом экране повторяем ИНСТРУКЦИЮ: буква остаётся беззвучной,
     но ребёнок должен иметь возможность переспросить, что делать. */
  const k = (z && z.stupen.tip === 'nemaya') ? 'nemaya_vstup' : (z ? kodRepliki(z) : null);
  if (k){ ostanovitPovtor(); skazat(k, () => zapustitPovtor(k)); }
};
/* 🚨 Вход для взрослого закрыт примером на умножение: шестилетка его не решит,
   а взрослый решит не думая. Пароль тут был бы хуже — родитель его забудет,
   а вводить при ребёнке всё равно придётся, и тот запомнит с трёх раз.
   Дыру нашёл сам, прогоняя работу по пяти пунктам практикума. */
let pinOtvet = 0;
el('ugol').onclick = () => {
  const a = 3 + Math.floor(Math.random()*6), b = 4 + Math.floor(Math.random()*6);
  pinOtvet = a * b;
  el('pin-vopros').textContent = `${a} × ${b}`;
  const verno = pinOtvet;
  const varianty = [verno, verno + b, verno - a, verno + 7, verno - b, verno + a]
    .filter((v,i,m) => v > 0 && m.indexOf(v) === i).slice(0, 6)
    .sort(() => Math.random() - .5);
  el('pin-cifry').innerHTML = varianty.map(v => `<button data-v="${v}">${v}</button>`).join('');
  el('pin-cifry').querySelectorAll('button').forEach(b => b.onclick = () => {
    if (+b.dataset.v === pinOtvet){
      el('pin').classList.remove('vidno');
      sobratKartu(); el('karta').classList.add('vidno');
    } else {
      b.style.opacity = '.3'; b.disabled = true;
    }
  });
  el('pin').classList.add('vidno');
};
el('pin-otmena').onclick = () => el('pin').classList.remove('vidno');
el('zakryt').onclick = () => el('karta').classList.remove('vidno');

zagruzit().catch(e => {
  el('vhod').innerHTML = '<h1>Не получилось загрузить</h1>' +
    '<p class="pod">Открой приложение ещё раз</p>';
  console.error(e);
});
</script>
